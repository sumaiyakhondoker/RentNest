$kind: http-request
url: localhost:5000/api/auth/login
method: POST
body:
  type: json
  content: "{  \r

    \    \"email\": \"sarah@roy.com\",\r

    \    \"password\": \"abc123\"\r

    }"
auth:
  type: jwt
  credentials:
    algorithm: HS256
    isSecretBase64Encoded: false
    addTokenTo: header
    payload: "{}"
    queryParamKey: token
    header: "{}"
    headerPrefix: Bearer
settings: {}
order: 2000
